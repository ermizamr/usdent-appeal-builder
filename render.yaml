services:
  - type: web
    name: usdent-api
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: USDENT_UI_ORIGINS
        value: https://usdent-appeal-builder.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: USDENT_TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: USDENT_PDF_OCR
        value: auto
      - key: USDENT_PDF_DPI
        value: "300"
      - key: USDENT_AI_MODEL
        value: llama-3.3-70b-versatile
      - key: USDENT_AI_ENDPOINT
        value: https://api.groq.com/openai/v1/chat/completions
      - key: LLAMA_API_KEY
        sync: false
